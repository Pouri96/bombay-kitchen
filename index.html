<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="End-of-shift fridge check for the Bombay kitchen. Flags what is short and writes the message for the next shift.">
<meta name="theme-color" content="#0C4A43">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kitchen Check">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}
img{max-width:100%}
[hidden]:not([hidden="until-found"]){display:none!important}
</style>
<title>Bombay Kitchen Check</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&family=Rozha+One&display=swap">

<style>
/* Layout: one scrolling chit on a peacock-enamel field. Painted shop-sign plate at the top,
   two brass-ruled sections of item rows, fixed thumb-reach bar that writes the message. */
:root{
  --field:#0C4A43;        /* enamel green ground */
  --field-deep:#07332E;   /* sign plate, bottom bar */
  --chit:#F6EDDD;         /* docket paper */
  --chit-edge:#DFCEB2;
  --on-field:#F6EDDD;     /* text on the green field, light in BOTH themes */
  --well:#0C4A43;         /* steel-tile ground behind each food icon */
  --ink:#241510;
  --ink-soft:#6E5A4C;
  --brass:#B9873B;
  --enough:#2A7034;       /* enough left */
  --madder:#A8322A;       /* out of stock */
  --marigold:#E09112;     /* maybe need more */
  --on-enough:#F6EDDD;
  --on-madder:#FBF1E2;
  --on-marigold:#241510;
  --wash-enough:rgba(42,112,52,.09);
  --wash-out:rgba(168,50,42,.09);
  --wash-low:rgba(224,145,18,.13);
  --report-bg:rgba(36,21,16,.05);
  --display:"Rozha One",Georgia,"Times New Roman",serif;
  --body:"Mukta","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --target:44px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --field:#06211D; --field-deep:#030F0D;
    --chit:#1D1510; --chit-edge:#3A2A1E; --well:#11332D; --on-field:#EFE2CE;
    --ink:#F3E7D5; --ink-soft:#AF9B87;
    --brass:#CFA053; --enough:#63BF6E; --madder:#DC6054; --marigold:#F0B13F;
    --on-enough:#1D1510; --on-madder:#1D1510; --on-marigold:#1D1510;
    --wash-enough:rgba(99,191,110,.13);
    --wash-out:rgba(220,96,84,.13); --wash-low:rgba(240,177,63,.14);
    --report-bg:rgba(243,231,213,.06);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --field:#06211D; --field-deep:#030F0D;
  --chit:#1D1510; --chit-edge:#3A2A1E; --well:#11332D; --on-field:#EFE2CE;
  --ink:#F3E7D5; --ink-soft:#AF9B87;
  --brass:#CFA053; --enough:#63BF6E; --madder:#DC6054; --marigold:#F0B13F;
  --on-enough:#1D1510; --on-madder:#1D1510; --on-marigold:#1D1510;
  --wash-enough:rgba(99,191,110,.13);
  --wash-out:rgba(220,96,84,.13); --wash-low:rgba(240,177,63,.14);
  --report-bg:rgba(243,231,213,.06);
  color-scheme:dark;
}
@media (pointer: coarse){ :root{ --target:48px } }

*{box-sizing:border-box}
body{
  background:var(--field); color:var(--on-field);
  font:400 1rem/1.5 var(--body);
  overflow-wrap:anywhere;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:1.25rem 0;
}
.wrap{max-width:62rem;margin-inline:auto;padding-bottom:calc(6.5rem + env(safe-area-inset-bottom,0px))}
h1,h2,h3{text-wrap:balance;margin:0}
p{text-wrap:pretty;margin:0}
:where(button){font:inherit;cursor:pointer;color:inherit}
:where(button,input,a){min-block-size:var(--target)}
:where(button,input):focus-visible,a:focus-visible{outline:3px solid var(--marigold);outline-offset:2px}

/* ── painted shop sign ──────────────────────────────── */
.sign{
  background:var(--field-deep);
  border:3px double var(--brass);
  border-radius:6px;
  padding:1.15rem 1rem 1rem;
  text-align:center;
  box-shadow:inset 0 0 0 1px rgba(185,135,59,.3);
}
.refresh{
  display:flex;margin:-.35rem -.1rem .5rem auto;
  align-items:center;align-items:center;gap:.4rem;
  min-height:44px;padding:0 .85rem;
  background:transparent;color:var(--brass);
  border:1.5px solid var(--brass);border-radius:999px;
  font:700 .78rem/1 var(--body);letter-spacing:.08em;cursor:pointer;
}
.refresh:hover{background:rgba(185,135,59,.18)}
.refresh svg{width:18px;height:18px;display:block}
.refresh.busy svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.refresh.busy svg{animation:none}}
.sign h1{
  font:400 clamp(2.1rem,11vw,3.4rem)/.95 var(--display);
  color:var(--marigold);
  letter-spacing:.17em;
  text-indent:.17em;
}
.sign .tag{
  font:700 .74rem/1 var(--body);
  letter-spacing:.26em;text-indent:.26em;
  color:var(--brass);
  margin-top:.5rem;
}
.sign .tag::before,.sign .tag::after{content:"\2022";margin-inline:.6em;color:var(--brass)}

/* ── sections ───────────────────────────────────────── */
.cols{display:grid;gap:2rem;margin-top:2rem}
@media (min-width:62rem){ .cols{grid-template-columns:1fr 1fr;gap:2rem 1.75rem;align-items:start} }

.sec-rule{height:5px;border-top:2px solid var(--brass);border-bottom:1px solid var(--brass);margin-bottom:.7rem}
.sec-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:.25rem .75rem}
.sec-top h2{font:400 clamp(1.5rem,6vw,1.95rem)/1 var(--display);color:var(--on-field);letter-spacing:.01em}
.sec-count{
  font:800 .72rem/1 var(--body);letter-spacing:.14em;
  color:var(--field-deep);background:var(--brass);
  padding:.38rem .55rem;border-radius:3px;font-variant-numeric:tabular-nums;white-space:nowrap;
}
.sec-count[data-zero="true"]{background:transparent;color:var(--brass);box-shadow:inset 0 0 0 1.5px var(--brass)}
.sec-sub{color:var(--brass);font-size:.92rem;margin-top:.3rem}
.list{list-style:none;margin:.9rem 0 0;padding:0;display:grid;gap:.6rem}

/* ── item chit ──────────────────────────────────────── */
.chit{
  container:chit / inline-size;
  background:var(--chit);
  border:2px solid var(--chit-edge);
  border-radius:6px;
  padding:.6rem;
  display:grid;gap:.55rem;
}
.row{display:flex;align-items:center;gap:.75rem;min-width:0}
.well{
  flex:none;width:56px;height:56px;
  background:var(--well);
  border:1.5px solid var(--brass);
  border-radius:14px;
  display:grid;place-items:center;overflow:hidden;
}
.well svg{width:52px;height:52px;display:block}
.name{font:700 1.0625rem/1.2 var(--body);color:var(--ink);min-width:0;flex:1 1 auto}
.acts{display:grid;gap:.5rem;grid-template-columns:1fr 1fr;grid-template-areas:"enough enough" "out low"}
.act.enough{grid-area:enough}
.act.out{grid-area:out}
.act.low{grid-area:low}
.act{
  min-height:var(--target);padding:.5rem .4rem;
  font:800 .74rem/1.15 var(--body);letter-spacing:.03em;text-transform:uppercase;
  background:var(--chit);color:var(--ink-soft);
  border:2px solid var(--chit-edge);border-radius:4px;
  transition:background .12s,color .12s,border-color .12s;
}
.act.enough[aria-pressed="false"]:hover{border-color:var(--enough);color:var(--enough)}
.act.out[aria-pressed="false"]:hover{border-color:var(--madder);color:var(--madder)}
.act.low[aria-pressed="false"]:hover{border-color:var(--marigold);color:var(--ink)}
.act[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--chit),inset 0 0 0 3.5px currentColor}
.act.enough[aria-pressed="true"]{background:var(--enough);border-color:var(--enough);color:var(--on-enough)}
.act.out[aria-pressed="true"]{background:var(--madder);border-color:var(--madder);color:var(--on-madder)}
.act.low[aria-pressed="true"]{background:var(--marigold);border-color:var(--marigold);color:var(--on-marigold)}

@container chit (inline-size > 24rem){
  .acts{grid-template-columns:1fr 1fr 1fr;grid-template-areas:"enough out low"}
}

/* dashed edge = not answered yet, so unchecked rows are visible while scrolling */
.chit[data-state="todo"]{border-style:dashed;border-color:var(--brass)}
.chit[data-state="enough"]{border-color:var(--enough);background:linear-gradient(var(--wash-enough),var(--wash-enough)),var(--chit)}
.chit[data-state="enough"] .act.out,.chit[data-state="enough"] .act.low{opacity:.4}
.chit[data-state="out"]{border-color:var(--madder);background:linear-gradient(var(--wash-out),var(--wash-out)),var(--chit)}
.chit[data-state="out"] .act.enough,.chit[data-state="out"] .act.low{opacity:.4}
.chit[data-state="low"]{border-color:var(--marigold);background:linear-gradient(var(--wash-low),var(--wash-low)),var(--chit)}
.chit[data-state="low"] .act.enough,.chit[data-state="low"] .act.out{opacity:.4}

@keyframes nudge{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-6px)} 40%{transform:translateX(6px)}
  60%{transform:translateX(-3px)} 80%{transform:translateX(3px)}
}
.chit.nudge{animation:nudge .45s}
@media (prefers-reduced-motion: reduce){
  .chit.nudge{animation:none;box-shadow:0 0 0 3px var(--marigold)}
}

@keyframes land{
  0%{transform:scale(.88) rotate(-3deg)}
  55%{transform:scale(1.05) rotate(1deg)}
  100%{transform:scale(1) rotate(0)}
}
.act.landed{animation:land .26s cubic-bezier(.2,.85,.25,1)}
@media (prefers-reduced-motion: reduce){ .act.landed{animation:none} }

/* ── bottom bar ─────────────────────────────────────── */
.bar{
  position:fixed;inset:auto 0 0;z-index:20;
  background:var(--field-deep);
  border-top:3px double var(--brass);
  display:flex;align-items:center;gap:.75rem;
  padding-block:.7rem;
  padding-bottom:max(.7rem,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.bar-in{max-width:62rem;margin-inline:auto;width:100%;display:flex;align-items:center;gap:.75rem}
#tally{flex:1 1 auto;min-width:0;font:700 .95rem/1.25 var(--body);color:var(--brass);font-variant-numeric:tabular-nums}
#tally b{color:var(--on-field);font-weight:800}
.go{
  flex:none;background:var(--marigold);color:var(--on-marigold);
  border:2px solid var(--marigold);border-radius:4px;
  padding:.6rem 1rem;font:800 .85rem/1.1 var(--body);
  letter-spacing:.07em;text-transform:uppercase;
}
.go:hover{background:var(--brass);border-color:var(--brass)}
.go[data-ready="false"]{background:transparent;color:var(--brass);border-color:var(--brass)}
.go[data-ready="false"]:hover{background:var(--brass);color:var(--field-deep)}

/* ── message sheet ──────────────────────────────────── */
dialog{
  border:0;padding:0;background:transparent;max-width:min(40rem,100%);width:100%;
  color:var(--ink);
}
dialog::backdrop{background:rgba(4,22,19,.72)}
.sheet{
  background:var(--chit);border:3px double var(--brass);border-radius:6px;
  padding:1.1rem;display:grid;gap:.9rem;
  max-height:92dvh;overflow-y:auto;
}
.sheet h2{font:400 1.6rem/1 var(--display);color:var(--ink)}
.sheet-head{display:flex;align-items:center;gap:.75rem}
.x{flex:none;margin-left:auto;width:var(--target);height:var(--target);background:none;border:2px solid var(--chit-edge);border-radius:4px;color:var(--ink-soft);font-size:1.15rem;line-height:1}
/* one block per list, each copied on its own */
.block{display:grid;gap:.5rem;border-top:2px solid var(--brass);padding-top:.8rem}
.block-top{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.block-top h3{font:400 1.25rem/1 var(--display);color:var(--ink);flex:1 1 auto;min-width:0}
.tip{flex:none;font:700 .78rem/1 var(--body);color:var(--enough);opacity:0;transition:opacity .15s}
.tip:not(:empty){opacity:1}
.rep{
  font:400 .875rem/1.6 var(--mono);color:var(--ink);
  background:var(--report-bg);border:1px solid var(--chit-edge);border-radius:4px;
  padding:.85rem;margin:0;white-space:pre-wrap;max-height:28vh;overflow:auto;
}
.sheet-acts{display:flex;flex-wrap:wrap;gap:.55rem}
.sheet-acts > *{flex:1 1 9rem;min-width:0}
.btn{
  display:flex;align-items:center;justify-content:center;gap:.4rem;text-align:center;
  min-height:var(--target);padding:.55rem .9rem;border-radius:4px;
  font:800 .8rem/1.15 var(--body);letter-spacing:.06em;text-transform:uppercase;
  text-decoration:none;border:2px solid var(--ink);background:var(--chit);color:var(--ink);
}
.btn.copy{flex:none;background:var(--field);border-color:var(--field);color:var(--on-field)}
.btn.copy:hover{background:var(--field-deep);border-color:var(--field-deep)}
.btn.quiet{border-color:var(--chit-edge);color:var(--ink-soft)}
#said{font:700 .85rem/1.3 var(--body);color:var(--ink-soft);min-height:1.3em}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
</style>
</head>

<script>
(function(){
  "use strict";

  var LISTS = [
    { id:"todo", title:"Morning todo", sub:"Cook and prep before tomorrow's service",
      reportTitle:"MORNING TODO",
      items:[
        {id:"butter-chicken",   name:"Butter Chicken"},

        {id:"puri",                name:"Puri"},

        {id:"salad",               name:"Salad"},
        {id:"dahl",                name:"Dahl"},
        {id:"pav-bhaji",           name:"Pav Bhaji"},
        {id:"chicken-biryani",     name:"Chicken Biryani"},
        {id:"boiled-potato",       name:"Boiled Potato"}
      ]},
    { id:"inv", title:"Inventory", sub:"Bring up to the kitchen",
      reportTitle:"INVENTORY",
      items:[
        {id:"naan",            name:"Naan"},
        {id:"vada-pav",        name:"Vada Pav"},
        {id:"aloo-tikki",      name:"Aloo Tikki"},
        {id:"chicken-samosa",  name:"Chicken Samosa"},
        {id:"lamb-samosa",     name:"Lamb Samosa"},
        {id:"veggie-samosa",   name:"Veggie Samosa"},
        {id:"pakora",          name:"Pakora"}
      ]}
  ];

  var WORDS = { out:"OUT OF STOCK", low:"MAYBE NEED MORE" };
  var KEY = "bombay-kitchen-check-v2";
  var marks = {};
  var TOTAL = LISTS.reduce(function (n, l) { return n + l.items.length; }, 0);
  var CALM = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  try {
    var raw = localStorage.getItem(KEY);
    if (raw) {
      var saved = JSON.parse(raw);
      if (saved && typeof saved === "object" && saved.marks && typeof saved.marks === "object") {
        marks = saved.marks;
      }
    }
  } catch (e) { marks = {}; }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ marks: marks })); } catch (e) {}
  }

  /* ---------- refresh: drop cached copies, reload the latest and clear every answer ---------- */
  document.getElementById("refresh").addEventListener("click", function () {
    this.classList.add("busy");
    marks = {};
    try { localStorage.removeItem(KEY); } catch (e) {}
    var done = function () { location.reload(); };
    var jobs = [];
    try {
      if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
      if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
    } catch (e) {}
    Promise.all(jobs).then(done, done);
  });

  /* ---------- build the two lists ---------- */
  var cols = document.getElementById("cols");

  LISTS.forEach(function (list) {
    var sec = document.createElement("section");
    sec.innerHTML =
      '<div class="sec-rule"></div>' +
      '<div class="sec-top"><h2>' + list.title + '</h2>' +
      '<span class="sec-count" id="count-' + list.id + '"></span></div>' +
      '<p class="sec-sub">' + list.sub + '</p>';

    var ul = document.createElement("ul");
    ul.className = "list";

    list.items.forEach(function (item) {
      var li = document.createElement("li");
      li.className = "chit";
      li.dataset.item = item.id;
      li.innerHTML =
        '<div class="row">' +
          '<span class="well"><svg viewBox="0 0 48 48" aria-hidden="true"><use href="#i-' + item.id + '"></use></svg></span>' +
          '<span class="name" id="n-' + item.id + '">' + item.name + '</span>' +
        '</div>' +
        '<div class="acts" role="group" aria-labelledby="n-' + item.id + '">' +
          '<button class="act enough" type="button" data-mark="enough" aria-pressed="false">Enough left</button>' +
          '<button class="act out" type="button" data-mark="out" aria-pressed="false">Out of stock</button>' +
          '<button class="act low" type="button" data-mark="low" aria-pressed="false">Maybe need more</button>' +
        '</div>';
      ul.appendChild(li);
    });

    sec.appendChild(ul);
    cols.appendChild(sec);
  });

  /* ---------- paint state ---------- */
  function paint() {
    var flaggedAll = 0, leftAll = 0;

    LISTS.forEach(function (list) {
      var flagged = 0, left = 0;

      list.items.forEach(function (item) {
        var li = cols.querySelector('.chit[data-item="' + item.id + '"]');
        var state = marks[item.id] || "";
        li.dataset.state = state || "todo";
        li.querySelectorAll(".act").forEach(function (b) {
          b.setAttribute("aria-pressed", b.dataset.mark === state ? "true" : "false");
        });
        if (state === "out" || state === "low") flagged++;
        if (!state) left++;
      });

      flaggedAll += flagged;
      leftAll += left;

      var badge = document.getElementById("count-" + list.id);
      if (left > 0) {
        badge.textContent = left + " LEFT TO CHECK";
        badge.dataset.zero = "true";
      } else if (flagged > 0) {
        badge.textContent = flagged + " TO REPORT";
        badge.dataset.zero = "false";
      } else {
        badge.textContent = "ALL FINE";
        badge.dataset.zero = "true";
      }
    });

    var tally = document.getElementById("tally");
    var go = document.getElementById("write");

    if (leftAll > 0) {
      tally.innerHTML = "<b>" + leftAll + "</b> of " + TOTAL + " still to check";
      go.dataset.ready = "false";
      go.textContent = "Show what's left";
    } else if (flaggedAll === 0) {
      tally.innerHTML = "All " + TOTAL + " checked · nothing short";
      go.dataset.ready = "true";
      go.textContent = "Write the message";
    } else {
      tally.innerHTML = "<b>" + flaggedAll + "</b> " + (flaggedAll === 1 ? "item" : "items") + " to report";
      go.dataset.ready = "true";
      go.textContent = "Write the message";
    }
  }

  /* ---------- interaction ---------- */
  cols.addEventListener("click", function (ev) {
    var li = ev.target.closest(".chit");
    if (!li) return;
    var id = li.dataset.item;

    var act = ev.target.closest(".act");
    if (act) {
      var want = act.dataset.mark;
      marks[id] = marks[id] === want ? "" : want;
      if (marks[id] === want) {
        act.classList.remove("landed");
        void act.offsetWidth;
        act.classList.add("landed");
      }
      save(); paint();
    }
  });

  /* ---------- the message ---------- */
  function stamp() {
    var d = new Date();
    var day = new Intl.DateTimeFormat("en-GB", { weekday:"short", day:"numeric", month:"short", year:"numeric" }).format(d);
    var time = new Intl.DateTimeFormat("en-GB", { hour:"2-digit", minute:"2-digit", hour12:false }).format(d);
    return day + ", " + time;
  }

  /* each list is its own message, complete on its own so it can be sent alone */
  function buildFor(list) {
    var lines = ["BOMBAY — " + list.reportTitle, stamp(), ""];

    var flagged = list.items.filter(function (it) {
      return marks[it.id] === "out" || marks[it.id] === "low";
    }).sort(function (a, b) {
      return (marks[a.id] === "out" ? 0 : 1) - (marks[b.id] === "out" ? 0 : 1);
    });

    if (!flagged.length) {
      lines.push("Nothing to report.");
    } else {
      flagged.forEach(function (it) {
        lines.push("• " + it.name + " — " + WORDS[marks[it.id]]);
      });
    }

    return lines.join("\n");
  }

  var sheet = document.getElementById("sheet");
  var said = document.getElementById("said");

  function clearTips() {
    LISTS.forEach(function (l) { document.getElementById("tip-" + l.id).textContent = ""; });
  }

  LISTS.forEach(function (list) {
    var btn = document.getElementById("copy-" + list.id);
    var pre = document.getElementById("rep-" + list.id);
    var tip = document.getElementById("tip-" + list.id);
    var timer;

    function show(msg) {
      clearTimeout(timer);
      tip.textContent = "";
      requestAnimationFrame(function () { tip.textContent = msg; });
      timer = setTimeout(function () { tip.textContent = ""; }, 2500);
    }

    btn.addEventListener("click", function () {
      function fallback() {
        try {
          var r = document.createRange();
          r.selectNodeContents(pre);
          var s = window.getSelection();
          s.removeAllRanges();
          s.addRange(r);
          show("Selected — press Ctrl+C");
        } catch (e) {
          show("Select the text to copy");
        }
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(pre.textContent).then(function () { show("Copied"); }, fallback);
      } else {
        fallback();
      }
    });
  });

  document.getElementById("write").addEventListener("click", function () {
    /* every item must be answered before the message exists */
    var pending = cols.querySelector('.chit[data-state="todo"]');
    if (pending) {
      pending.scrollIntoView({ block: "center", behavior: CALM ? "auto" : "smooth" });
      pending.classList.remove("nudge");
      void pending.offsetWidth;
      pending.classList.add("nudge");
      return;
    }

    LISTS.forEach(function (list) {
      document.getElementById("rep-" + list.id).textContent = buildFor(list);
    });
    clearTips();
    said.textContent = "";
    resetArmed = false;
    document.getElementById("reset").textContent = "Start a new check";
    if (typeof sheet.showModal === "function") sheet.showModal();
  });

  document.getElementById("close").addEventListener("click", function () { sheet.close(); });

  var resetArmed = false;
  var resetBtn = document.getElementById("reset");
  var resetTimer;
  resetBtn.addEventListener("click", function () {
    if (!resetArmed) {
      resetArmed = true;
      resetBtn.textContent = "Tap again to clear";
      said.textContent = "This clears every tick and report.";
      clearTimeout(resetTimer);
      resetTimer = setTimeout(function () {
        resetArmed = false;
        resetBtn.textContent = "Start a new check";
        said.textContent = "";
      }, 4000);
      return;
    }
    clearTimeout(resetTimer);
    resetArmed = false;
    marks = {};
    save();
    paint();
    resetBtn.textContent = "Start a new check";
    sheet.close();
  });

  paint();
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  addEventListener("load", function () {
    navigator.serviceWorker.register("./sw.js").catch(function () {});
  });
}
</script>
